name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lightweight-check:
    name: Lightweight Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_macos: ${{ steps.changes.outputs.run_macos }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed_files="$RUNNER_TEMP/changed-files"

          if [[ "$EVENT_NAME" == 'workflow_dispatch' ]]; then
            run_macos=true
          else
            if [[ "$EVENT_NAME" == 'pull_request' ]]; then
              git diff --name-only -z "$BASE_SHA...$HEAD_SHA" > "$changed_files"
            elif [[ -n "$BEFORE_SHA" && ! "$BEFORE_SHA" =~ ^0+$ ]]; then
              git diff --name-only -z "$BEFORE_SHA" "$CURRENT_SHA" > "$changed_files"
            elif git rev-parse "${CURRENT_SHA}^" >/dev/null 2>&1; then
              git diff --name-only -z "${CURRENT_SHA}^" "$CURRENT_SHA" > "$changed_files"
            else
              git ls-tree -r --name-only -z "$CURRENT_SHA" > "$changed_files"
            fi

            run_macos=false
            while IFS= read -r -d '' path; do
              case "$path" in
                README.md | LICENSE | AGENTS.md | docs/*) ;;
                *) run_macos=true; break ;;
              esac
            done < "$changed_files"

            if node -e "const manifest = require('./Config/Release/manifest.json'); process.exit(manifest.release === true ? 0 : 1)"; then
              run_macos=true
            fi
          fi

          echo "run_macos=$run_macos" >> "$GITHUB_OUTPUT"

      - name: Validate automation
        run: |
          bash -n Scripts/create-dmg.sh
          Scripts/create-dmg.sh --help >/dev/null
          node .github/scripts/release-manifest.mjs validate
          node --test .github/scripts/*.test.mjs

  macos-check:
    name: Build Kairos
    needs: lightweight-check
    if: needs.lightweight-check.outputs.run_macos == 'true'
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

      - name: Report toolchain
        run: |
          xcodebuild -version
          node --version

      - name: Build unsigned app and Helper
        run: |
          set -o pipefail
          xcodebuild build \
            -project Kairos.xcodeproj \
            -scheme Kairos \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build/DerivedData-Release \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Verify artifact contract
        run: |
          app='build/DerivedData-Release/Build/Products/Release/Kairos.app'
          binary="$app/Contents/MacOS/Kairos"
          helper="$app/Contents/Resources/studio.slippindylan.BrewKit.Kairos.helper"
          daemon_plist="$app/Contents/Library/LaunchDaemons/studio.slippindylan.BrewKit.Kairos.helper.plist"
          test -d "$app"
          test -x "$binary"
          test -x "$helper"
          test -f "$daemon_plist"
          test "$(lipo -archs "$binary")" = 'arm64'
          test "$(lipo -archs "$helper")" = 'arm64'
          test "$(vtool -show-build "$binary" | grep -c 'minos 26.0')" -eq 1
          test "$(vtool -show-build "$helper" | grep -c 'minos 26.0')" -eq 1
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSUIElement' "$app/Contents/Info.plist")" = 'true'
          test "$(plutil -extract BundleProgram raw -o - "$daemon_plist")" = 'Contents/Resources/studio.slippindylan.BrewKit.Kairos.helper'
          test "$(plutil -extract 'MachServices.studio\.slippindylan\.BrewKit\.Kairos\.helper' raw -o - "$daemon_plist")" = 'true'

  build-check:
    # Keep this context stable because the main ruleset requires "Build Check".
    name: Build Check
    needs:
      - lightweight-check
      - macos-check
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify CI result
        env:
          LIGHTWEIGHT_RESULT: ${{ needs.lightweight-check.result }}
          MACOS_RESULT: ${{ needs.macos-check.result }}
        run: |
          test "$LIGHTWEIGHT_RESULT" = 'success'
          [[ "$MACOS_RESULT" == 'success' || "$MACOS_RESULT" == 'skipped' ]]
