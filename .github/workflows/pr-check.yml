name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-check:
    # Keep this context stable because the main ruleset requires "Build Check".
    name: Build Check
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

      - name: Report toolchain
        run: |
          xcodebuild -version
          node --version

      - name: Validate automation
        run: |
          bash -n Scripts/create-dmg.sh
          Scripts/create-dmg.sh --help >/dev/null
          node .github/scripts/release-manifest.mjs validate
          node --test .github/scripts/*.test.mjs

      - name: Build unsigned app and Helper
        run: |
          set -o pipefail
          xcodebuild build \
            -project Enodia.xcodeproj \
            -scheme Enodia \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build/DerivedData-Release \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Verify artifact contract
        run: |
          app='build/DerivedData-Release/Build/Products/Release/Enodia.app'
          binary="$app/Contents/MacOS/Enodia"
          helper="$app/Contents/Resources/studio.slippindylan.BrewKit.Enodia.helper"
          daemon_plist="$app/Contents/Library/LaunchDaemons/studio.slippindylan.BrewKit.Enodia.helper.plist"
          test -d "$app"
          test -x "$binary"
          test -x "$helper"
          test -f "$daemon_plist"
          test "$(lipo -archs "$binary")" = 'arm64'
          test "$(lipo -archs "$helper")" = 'arm64'
          test "$(vtool -show-build "$binary" | grep -c 'minos 26.0')" -eq 1
          test "$(vtool -show-build "$helper" | grep -c 'minos 26.0')" -eq 1
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSUIElement' "$app/Contents/Info.plist")" = 'true'
          test "$(plutil -extract BundleProgram raw -o - "$daemon_plist")" = 'Contents/Resources/studio.slippindylan.BrewKit.Enodia.helper'
          test "$(plutil -extract 'MachServices.studio\.slippindylan\.BrewKit\.Enodia\.helper' raw -o - "$daemon_plist")" = 'true'
